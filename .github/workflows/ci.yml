name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            lint: true
          - elixir: "1.18"
            otp: "26"
          - elixir: "1.18"
            otp: "25"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

      - if: matrix.lint
        run: mix format --check-formatted

      - if: matrix.lint
        run: mix credo --strict

      - if: matrix.lint
        run: mix dialyzer --format github

      - if: matrix.lint
        run: mix hex.build --unpack --output /tmp/humanizer-package

      - if: matrix.lint
        name: Verify the Hex package excludes the demo
        run: test ! -e /tmp/humanizer-package/demo

  demo:
    runs-on: ubuntu-latest
    name: Phoenix LiveView demo
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/cache@v6
        with:
          path: |
            demo/deps
            demo/_build
          key: ${{ runner.os }}-demo-otp27-elixir1.18-${{ hashFiles('demo/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-otp27-elixir1.18-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: MIX_ENV=prod mix assets.deploy
      - run: MIX_ENV=prod mix release

  demo-container:
    runs-on: ubuntu-latest
    name: Phoenix demo container
    needs: demo
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f demo/Dockerfile -t humanizer-demo .
